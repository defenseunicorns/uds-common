variables:
  - name: FLAVOR
    default: upstream
  - name: NEXT_MODE
    default: "false"

tasks:
  - name: package
    description: Create the UDS Zarf Package in the repository
    inputs:
      options:
        description: For setting create time variables and flags
      path:
        description: Path to the zarf package definition being created
        default: .
      architecture:
        description: The architecture of the package to create
        default: ${UDS_ARCH}
      config:
        description: Optionally provide a path to a Zarf config file
        default: ""
        required: false
    actions:
      - description: Resolve the Zarf package definition path
        cmd: |
          if [ -f "${{ .inputs.path }}/compose.yaml" ]; then
            echo "${{ .inputs.path }}/build"
          else
            echo "${{ .inputs.path }}"
          fi
        mute: true
        setVariables:
          - name: CREATE_PACKAGE_PATH

      - description: Convert the Docker Compose application to a UDS package definition
        if: ${{ ne .variables.CREATE_PACKAGE_PATH .inputs.path }}
        cmd: >-
          docker compose
          -f "${{ .inputs.path }}/compose.yaml"
          bridge convert
          --transformation "ghcr.io/defenseunicorns/compose-bridge-uds:1.1.0"
          --output "${CREATE_PACKAGE_PATH}"
          --yes

      - env:
          - ZARF_CONFIG=${{ .inputs.config }}
        cmd: ./zarf package create "${CREATE_PACKAGE_PATH}" --confirm --architecture="${{ .inputs.architecture }}" --flavor "${FLAVOR}" --features values=true ${{ .inputs.options }}

  - name: test-bundle
    description: Create the test bundle (bundling package + dependencies for testing)
    inputs:
      options:
        description: For setting create time variables and flags
      path:
        description: Path relative to the repositories root where the bundle definition lives
        default: bundle
      config:
        description: Path to the bundle config file. Defaults to bundle/uds-config.yaml.
        default: bundle/uds-config.yaml
      architecture:
        description: The architecture of the bundle to create
        default: ${UDS_ARCH}
    actions:
      - description: Create the legacy test bundle
        if: ${{ ne .variables.NEXT_MODE "true" }}
        env:
          - UDS_CONFIG=${{ .inputs.config }}
        cmd: |
          set -e

          # Find any flavored packages in the target directory
          echo "Looking for ${FLAVOR} flavored packages in '.'"

          # Find all flavored packages, regardless of package version
          for FLAVORED_PACKAGE in $(find . -maxdepth 1 -name "zarf-package-*-${{ .inputs.architecture }}-*-${FLAVOR}.tar.zst" 2>/dev/null || echo ""); do
            # Extract the base name without flavor
            BASE_NAME=$(echo "${FLAVORED_PACKAGE}" | sed "s/-${FLAVOR}\.tar\.zst/.tar.zst/")

            echo "Found ${FLAVOR} flavored package: ${FLAVORED_PACKAGE}"
            echo "Creating non-flavored version: ${BASE_NAME}"

            # Copy to non-flavored version (overwrite if exists)
            cp "${FLAVORED_PACKAGE}" "${BASE_NAME}"
          done

          # Proceed with bundle creation regardless of package file status
          ./uds create ${{ .inputs.path }} --confirm --no-progress --architecture="${{ .inputs.architecture }}" ${{ .inputs.options }}

      - description: Create the Next mode test bundle
        if: ${{ eq .variables.NEXT_MODE "true" }}
        cmd: |
          set -e
          BUNDLE_DIR="${{ .inputs.path }}"
          ARCH="${{ .inputs.architecture }}"

          if [ ! -f "${BUNDLE_DIR}/bundle.uds.hcl" ]; then
            echo "NEXT_MODE=true requires ${BUNDLE_DIR}/bundle.uds.hcl. Add a Next bundle definition or remove --set NEXT_MODE=true."
            exit 1
          fi

          # Next bundles reference the local package artifact. Keep the same unflavored filename
          # compatibility that legacy uds-bundle.yaml expects for flavor-gated packages.
          for FLAVORED_PACKAGE in $(find . -maxdepth 1 -name "zarf-package-*-${ARCH}-*-${FLAVOR}.tar.zst" 2>/dev/null || echo ""); do
            BASE_NAME=$(echo "${FLAVORED_PACKAGE}" | sed "s/-${FLAVOR}\.tar\.zst/.tar.zst/")
            cp "${FLAVORED_PACKAGE}" "${BASE_NAME}"
          done

          # Create an unsigned artifact for common test/dev workflows. Signature knobs can be added later
          # without changing the caller-facing NEXT_MODE toggle.
          CREATE_OUTPUT=$(CLI_FEATURES=NextMode=true ./uds bundle create "${BUNDLE_DIR}" --unsigned --architecture="${ARCH}" -o json ${{ .inputs.options }})
          printf '%s\n' "${CREATE_OUTPUT}"
          ARTIFACT=$(printf '%s' "${CREATE_OUTPUT}" | ./zarf tools yq -r '.outputPath')
          echo "Created Next bundle artifact: ${ARTIFACT}"

variables:
  - name: NEXT_MODE
    default: "false"

tasks:
  - name: package
    description: Deploy the created UDS Zarf Package
    inputs:
      options:
        description: For setting deploy time variables and flags
      path:
        description: Path relative to the repositories root where the zarf.yaml and .tar.zst lives
        default: .
      architecture:
        description: The architecture of the package to deploy
        default: ${UDS_ARCH}
      config:
        description: Optionally provide a path to a Zarf config file
        default: ""
        required: false
      flavor:
        description: The flavor of the package to build
        default: ${FLAVOR}
    actions:
      - description: Get the current Zarf package name
        cmd: cat ${{ .inputs.path }}/zarf.yaml | ./zarf tools yq .metadata.name
        setVariables:
          - name: PACKAGE_NAME
      - description: Get the current Zarf package version
        cmd: cat ${{ .inputs.path }}/zarf.yaml | ./zarf tools yq .metadata.version
        setVariables:
          - name: PACKAGE_VERSION
      - description: Get the current Zarf package flavor suffix
        cmd: |
          # shellcheck disable=SC2157
          if [ -z "${{ .inputs.flavor }}" ]; then echo ""; else echo "-${{ .inputs.flavor }}"; fi
        setVariables:
          - name: FLAVOR_SUFFIX
      - description: Deploy the UDS Zarf Package
        env:
          - ZARF_CONFIG=${{ .inputs.config }}
        cmd: ./zarf package deploy "${{ .inputs.path }}/zarf-package-${PACKAGE_NAME}-${{ .inputs.architecture }}-${PACKAGE_VERSION}${FLAVOR_SUFFIX}.tar.zst" --confirm --features values=true ${{ .inputs.options }}

  - name: test-bundle
    description: Deploy the created test bundle (deploying package + dependencies for testing)
    inputs:
      path:
        description: Path relative to the repositories root where the bundle definition and .tar.zst live
        default: bundle
      config:
        description: Path to the legacy bundle config file. Defaults to bundle/uds-config.yaml.
        default: bundle/uds-config.yaml
      next_config:
        description: Path to the Next mode bundle config file. Defaults to bundle/config.uds.hcl.
        default: bundle/config.uds.hcl
      architecture:
        description: The architecture of the bundle to deploy
        default: ${UDS_ARCH}
      options:
        description: For setting deploy time variables and flags
    actions:
      - description: Get the current UDS Bundle name
        cmd: cat ${{ .inputs.path }}/uds-bundle.yaml | ./zarf tools yq .metadata.name
        setVariables:
          - name: BUNDLE_NAME
      - description: Get the current UDS Bundle version
        cmd: cat ${{ .inputs.path }}/uds-bundle.yaml | ./zarf tools yq .metadata.version
        setVariables:
          - name: BUNDLE_VERSION
      - description: Resolve bundle deploy mode
        cmd: |
          BUNDLE="${{ .inputs.path }}/uds-bundle-${BUNDLE_NAME}-${{ .inputs.architecture }}-${BUNDLE_VERSION}.tar.zst"
          if [ "${{ .variables.NEXT_MODE }}" = "true" ] && CLI_FEATURES=NextMode=true ./uds bundle inspect "${BUNDLE}" -o json >/dev/null 2>&1; then
            echo "true"
          else
            echo "false"
          fi
        setVariables:
          - name: DEPLOY_NEXT_BUNDLE

      - description: Deploy the legacy UDS bundle with the package and its dependencies
        if: ${{ ne .variables.DEPLOY_NEXT_BUNDLE "true" }}
        env:
          - UDS_CONFIG=${{ .inputs.config }}
        cmd: ./uds deploy "${{ .inputs.path }}/uds-bundle-${BUNDLE_NAME}-${{ .inputs.architecture }}-${BUNDLE_VERSION}.tar.zst" --confirm --no-progress ${{ .inputs.options }}

      - description: Deploy the Next mode UDS bundle with the package and its dependencies
        if: ${{ eq .variables.DEPLOY_NEXT_BUNDLE "true" }}
        cmd: CLI_FEATURES=NextMode=true ./uds bundle deploy "${{ .inputs.path }}/uds-bundle-${BUNDLE_NAME}-${{ .inputs.architecture }}-${BUNDLE_VERSION}.tar.zst" --skip-signature-verification --config "${{ .inputs.next_config }}" ${{ .inputs.options }}

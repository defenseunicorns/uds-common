name: Lint

on:
  # This workflow is triggered on pull requests to the main branch.
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    types: [milestoned, opened, reopened, synchronize]
  # This allows other repositories to call this workflow in a reusable way
  workflow_call:
    inputs:
      values-check:
        description: Opt in to the Zarf values schema freshness check
        type: boolean
        default: false
      values-path:
        description: Path to the Zarf package definition for the values check
        type: string
        default: .
      values-flavor:
        description: Package flavor used for the values check; empty for an unflavored package
        type: string
        default: upstream

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows reading the repo contents

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
        shell: bash

      - name: Install lint deps
        run: uds run lint:deps --no-progress

      - name: Lint the repository
        run: uds run lint:all --no-progress

      - name: Check Zarf values schema freshness
        if: ${{ inputs.values-check }}
        env:
          VALUES_PACKAGE_PATH: ${{ inputs.values-path }}
          VALUES_FLAVOR: ${{ inputs.values-flavor }}
        shell: bash
        run: |
          uds run lint:values-check --no-progress \
            --with path="$VALUES_PACKAGE_PATH" \
            --with flavor="$VALUES_FLAVOR"

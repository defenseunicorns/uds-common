name: Callable-Publish

on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to publish for; arm64, amd64, etc. (defaults to runner architecture when empty)
        required: false
        type: string
        default: ""
      base-repo:
        description: The base repository to publish to (defaults to ghcr.io/<organization> when empty)
        required: false
        type: string
        default: ""
      runsOn:
        default: ubuntu-latest
        type: string
      flavor:
        required: true
        type: string
      options:
        type: string
        description: Additional options to set when running the test
        default: ""
      reports-path:
        type: string
        description: The path to test outputs to upload
      reports-name:
        type: string
        description: The name prefix for upload test reports
        default: playwright-report
      timeout:
        type: number
        default: 40
      publish-repo:
        type: boolean
        default: true
        description: Whether to also publish repo contents as a separate artifact
      signing:
        type: boolean
        default: false
        description: Prepare tested packages for a caller-owned signing job instead of publishing directly
      uds-pk:
        type: boolean
        default: true
        description: Whether to use the uds-pk for publishing
      uds-releaser:
        type: boolean
        default: false
        description: "DEPRECATED: Whether to use the UDS Releaser for publishing"
      team:
        type: string
        default: ""
        description: Team path segment inserted between 'private' and the package name (e.g. 'uds'). Required when the registry uses a team subdirectory (non-uds-packages orgs).
      dockerComposeVersion:
        description: The Docker Compose version to install
        # renovate: datasource=github-tags depName=docker/compose versioning=semver
        default: 5.6.1
        type: string
      composeBridgeVersion:
        description: The Compose Bridge version to use
        # renovate: datasource=github-tags depName=defenseunicorns/compose-bridge-uds versioning=semver
        default: 1.3.1
        type: string
    secrets:
      LICENSE_KEY:
        required: false

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.
  packages: read # Allows reading the content of the repository's packages.
  id-token: write

jobs:
  run:
    runs-on: ${{ inputs.runsOn }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v${{ inputs.dockerComposeVersion }}

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      - name: Install ORAS CLI
        if: ${{ inputs.publish-repo && !inputs.signing }}
        run: uds run actions:install-oras --no-progress
        shell: bash

      - name: Environment setup
        run: |
            echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
            uds run actions:setup-environment \
            --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
            --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
            --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --set RAPIDFORT_USERNAME="${{ secrets.RAPIDFORT_USERNAME }}" \
            --set RAPIDFORT_PASSWORD="${{ secrets.RAPIDFORT_PASSWORD }}" \
            --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      - name: Parse inputs
        id: parse-inputs
        run: |
          # Determine uds-pk flag (preserve existing deprecated handling)
          if [ "${{ inputs.uds-releaser }}" = "true" ]; then
            echo "::warning title=Deprecated-Input::The uds-releaser input is deprecated, please use uds-pk instead"
            echo "uds-pk=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.uds-pk }}" = "false" ]; then
            echo "uds-pk=false" >> "$GITHUB_OUTPUT"
          else
            echo "uds-pk=true" >> "$GITHUB_OUTPUT"
          fi

          # Compute arch output: use provided input when set, otherwise derive from runner.arch
          if [ -n "${{ inputs.arch }}" ]; then
            resolved_arch="${{ inputs.arch }}"
          else
            # Map runner.arch (X64, ARM64) to expected values (amd64, arm64)
            case "${{ runner.arch }}" in
              X64)   resolved_arch="amd64" ;;
              ARM64) resolved_arch="arm64" ;;
              *)     resolved_arch="${{ runner.arch }}" ;;
            esac
          fi
          echo "arch=${resolved_arch}" >> "$GITHUB_OUTPUT"

          # Compute base-repo output: use provided input when set, otherwise default to ghcr.io/<organization>
          if [ -n "${{ inputs.base-repo }}" ]; then
            resolved_base_repo="${{ inputs.base-repo }}"
          else
            # Prefer GITHUB_REPOSITORY_OWNER if present, else parse GITHUB_REPOSITORY
            owner="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
            resolved_base_repo="ghcr.io/${owner}"
          fi
          echo "base-repo=${resolved_base_repo}" >> "$GITHUB_OUTPUT"

          # Debug output
          echo "Resolved arch: ${resolved_arch}"
          echo "Resolved base-repo: ${resolved_base_repo}"

      - name: Publish Packages/Bundles - release-please
        if: ${{ steps.parse-inputs.outputs.uds-pk == 'false' }}
        run: |
          signing_options=()
          if [ "${{ inputs.signing }}" = true ]; then
            signing_options=(--set SIGNING=true)
          fi
          if uds run --list | grep -wq 'publish-package'; then
            if [ -f compose.yaml ]; then
              RELEASE_PACKAGE_VERSION=$(uds zarf tools yq -r '."."' .release-please-manifest.json)
              RELEASE_PACKAGE_VERSION="${RELEASE_PACKAGE_VERSION}" uds zarf tools yq -i \
                '."x-uds".metadata.version = strenv(RELEASE_PACKAGE_VERSION)' compose.yaml
            else
              RELEASE_PACKAGE_VERSION=$(uds zarf tools yq -r '.metadata.version' zarf.yaml)
            fi
            uds run publish-package \
              --set USE_CHECKPOINT=false \
              --set FLAVOR=${{ inputs.flavor }} \
              --no-progress ${{ inputs.options }} "${signing_options[@]}"
          else
            uds run publish-release --set USE_CHECKPOINT=false --set FLAVOR=${{ inputs.flavor }} --no-progress ${{ inputs.options }} "${signing_options[@]}"
          fi

      - name: Publish Packages/Bundles - uds-pk
        id: uds-pk-publish
        if: ${{ steps.parse-inputs.outputs.uds-pk == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          signing_options=()
          if [ "${{ inputs.signing }}" = true ]; then
            signing_options=(--set SIGNING=true)
          fi
          if [ -f compose.yaml ]; then
            RELEASE_PACKAGE_VERSION=$(uds-pk release show "${{ inputs.flavor }}" --version-only)
            RELEASE_PACKAGE_VERSION="${RELEASE_PACKAGE_VERSION}" uds zarf tools yq -i \
              '."x-uds".metadata.version = strenv(RELEASE_PACKAGE_VERSION)' compose.yaml

            docker compose -f compose.yaml pull
            docker compose \
              -f compose.yaml \
              bridge convert \
              --transformation "ghcr.io/defenseunicorns/compose-bridge-uds:${{ inputs.composeBridgeVersion }}" \
              --output build \
              --yes

            if [ ! -f zarf.yaml ]; then
              cp build/zarf.yaml zarf.yaml
            fi
          fi

          release_needed=false
          if [ "${{ inputs.signing }}" = true ]; then
            release_needed=$(uds-pk release check "${{ inputs.flavor }}" --arch "${{ steps.parse-inputs.outputs.arch }}" --base-repo "${{ steps.parse-inputs.outputs.base-repo }}" --team "${{ inputs.team }}" --boolean)
            case "$release_needed" in
              true|false) ;;
              *) echo "Unexpected release check result: $release_needed" >&2; exit 1 ;;
            esac
          elif uds-pk release check "${{ inputs.flavor }}" --arch "${{ steps.parse-inputs.outputs.arch }}" --base-repo "${{ steps.parse-inputs.outputs.base-repo }}" --team "${{ inputs.team }}" --verbose; then
            release_needed=true
          fi

          if [ "$release_needed" = true ]; then
            uds-pk release update-yaml ${{ inputs.flavor }}

            if uds run --list | grep -wq 'publish-package'; then
              uds run publish-package \
                --set USE_CHECKPOINT=false \
                --set FLAVOR=${{ inputs.flavor }} \
                --set ENABLE_UDS_PK=true \
                --no-progress ${{ inputs.options }} \
                --set LICENSE_KEY=${{ secrets.LICENSE_KEY }} "${signing_options[@]}"
            else
              uds run publish-release \
                --set USE_CHECKPOINT=false \
                --set FLAVOR=${{ inputs.flavor }} \
                --set ENABLE_UDS_PK=true \
                --no-progress ${{ inputs.options }} \
                --set LICENSE_KEY=${{ secrets.LICENSE_KEY }} "${signing_options[@]}"
            fi
          elif [ "${{ inputs.signing }}" = true ]; then
            echo "no-release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Complete signing preparation
        if: ${{ inputs.signing }}
        shell: bash
        run: |
          uds run publish:complete-signing \
            --set FLAVOR=${{ inputs.flavor }} \
            --set ENABLE_UDS_PK=${{ steps.parse-inputs.outputs.uds-pk }} \
            --with architecture=${{ steps.parse-inputs.outputs.arch }} \
            --with publish_repo=${{ inputs.publish-repo }} \
            --with outcome=${{ steps.uds-pk-publish.outputs.no-release == 'true' && 'no-release' || 'prepared' }} \
            --no-progress ${{ inputs.options }}

      - name: "Upload signing candidates: uds-publish-${{ inputs.flavor || 'unflavored' }}-${{ steps.parse-inputs.outputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
        if: ${{ inputs.signing }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uds-publish-${{ inputs.flavor || 'unflavored' }}-${{ steps.parse-inputs.outputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/signing
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish Repo Contents
        if: ${{ inputs.publish-repo && !inputs.signing }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uds run publish:repo \
            --set FLAVOR=${{ inputs.flavor }} \
            --no-progress ${{ inputs.options }}

      - name: Debug Output
        if: ${{ always() }}
        run: uds run actions:debug-output
        shell: bash

      - name: Save logs
        if: ${{ always() }}
        run: uds run actions:save-logs
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: debug-log-${{ inputs.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}
          path: |
            /tmp/zarf-*.log
            /tmp/uds-*.log
            /tmp/maru-*.log
            /tmp/debug-*.log
            /tmp/uds-containerd-logs
            /tmp/k3d-uds-*.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && inputs.reports-path != '' }}
        with:
          name: ${{ inputs.reports-name }}-${{ inputs.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}
          path: ${{ inputs.reports-path }}
          retention-days: 30

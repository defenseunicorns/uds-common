name: Sign and publish
description: Sign tested packages with the caller workflow identity and complete publication

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install UDS CLI
      uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
      with:
        # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
        version: v0.40.0

    - name: Select prepared artifacts
      id: artifacts
      shell: bash
      run: uds run -f "$GITHUB_ACTION_PATH/tasks.yaml" sign:select-artifacts --no-progress

    - name: Download prepared artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.artifacts.outputs.artifact-ids }}
        path: ${{ runner.temp }}/uds-signing-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
        merge-multiple: false
        digest-mismatch: error

    - name: Prepare publication tools and authentication
      shell: bash
      run: uds run -f "$GITHUB_ACTION_PATH/tasks.yaml" setup --no-progress

    - name: Sign, verify, and publish
      shell: bash
      run: uds run -f "$GITHUB_ACTION_PATH/tasks.yaml" sign:publish-prepared --no-progress
